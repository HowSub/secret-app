name: secret
description: "Simple messanger"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  firebase_auth: ^6.7.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon/app_icon.jpg'

flutter:

  uses-material-design: true

  assets:
    - assets/images/app_icon/

